<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>SystemScope · Hardware &amp; performance</title>
<style>
:root {
  --paper:#f4f5ee; --card:#fffefa; --ink:#192a27; --muted:#52635e; --line:#d8dfd4;
  --teal:#126659; --low:#925014; --amber-pale:#fff0dc;
  --night:#172c29; --plot-text:#edf6ef; --mint:#75e3bb; --gold:#ffc483;
  --sans:"Inter","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Liberation Mono",monospace;
}
*,*::before,*::after {box-sizing:border-box}
body {margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
button,input,summary {font:inherit}
button, input[type=range], summary {cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible {outline:3px solid #237dba;outline-offset:4px}
[hidden] {display:none!important}
.shell {width:min(1120px,100%);padding:26px clamp(14px,3vw,38px) 24px;margin:0 auto}
header,.brand,.mode,.tile-top,.panel-head,.key,.plot-meta,.strip,.replay-control {display:flex;align-items:center}
header {justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand {gap:13px;min-width:0}
.mark {height:46px;width:46px;border-radius:12px;background:var(--night);display:flex;gap:3px;align-items:center;justify-content:center;flex:none}
.mark i {width:3px;border-radius:2px;background:var(--mint)}
.mark i:nth-child(1){height:10px}.mark i:nth-child(2){height:20px}.mark i:nth-child(3){height:30px}.mark i:nth-child(4){height:16px}.mark i:nth-child(5){height:23px}
h1,h2,h3,p {margin:0}
h1 {font-size:clamp(25px,3.2vw,36px);letter-spacing:-.055em;line-height:1;font-weight:730}
.subtitle {color:var(--muted);font-size:13px;margin-top:5px}
.export {display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--night);border-radius:8px;background:var(--night);color:#f7fff9;font-weight:650;padding:9px 14px;font-size:13px;white-space:nowrap}
.export:hover {background:#29483f}
.arrow {font:700 16px/1 var(--sans)}
.strip {justify-content:space-between;gap:18px;padding:18px 0}
.mode {font:650 13px/1.4 var(--sans);gap:9px;white-space:nowrap}
.mode-dot {height:10px;width:10px;background:#44766a;border-radius:100%;border:2px solid #f4f5ee;outline:1px solid #658579}
.replay-control {gap:12px;flex-wrap:nowrap;min-width:0}
.replay-control label,.live-caption {font-size:12px;color:var(--muted)}
input[type=range] {width:clamp(82px,16vw,182px);margin:0;accent-color:var(--teal)}
.time-label {min-width:45px;padding:3px 7px;text-align:center;border:1px solid #cbd8cd;border-radius:5px;font:600 12px/1.4 var(--mono);color:#2c5348;background:#eaf0e7}
.metrics {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile,.events,.hardware {border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tile {padding:16px 18px 14px;min-width:0}
.tile-top {justify-content:space-between;gap:6px;min-height:23px}
.tile h2,.chart h2,.events h2 {font-size:14px;font-weight:650;letter-spacing:-.02em}
.value-row {display:flex;gap:6px;align-items:baseline;margin:8px 0 10px}
.value {font-size:clamp(31px,3.8vw,46px);font-weight:580;line-height:1.1;letter-spacing:-.065em}
.unit {font:500 15px/1 var(--mono);color:var(--muted)}
.track {height:4px;background:#e5e9df;border-radius:3px;overflow:hidden}
.fill {display:block;height:100%;width:0;background:var(--teal);border-radius:3px}
.fill.low {background:#b87529}
.info {margin-top:8px;color:var(--muted);font-size:12px}
.badge {font:650 10px/1.3 var(--sans);border-radius:5px;padding:3px 7px;white-space:nowrap}
.badge.ok {color:#245e4e;background:#e4f1e8}
.badge.low {color:var(--low);background:var(--amber-pale)}
.badge.unknown {color:#535e5b;background:#edf0ef}
.body-grid {display:grid;grid-template-columns:minmax(0,1.65fr) minmax(230px,1fr);gap:12px;margin-top:12px}
.chart {min-width:0;border-radius:12px;background:var(--night);color:var(--plot-text);padding:18px 20px 12px}
.panel-head {justify-content:space-between;gap:12px;flex-wrap:wrap}
.chart h2,.events h2 {font-size:18px;letter-spacing:-.035em}
.key {gap:13px;font:500 11px/1.4 var(--mono);color:#d7e6dc}
.key span {display:inline-flex;align-items:center;gap:5px}
.swatch {width:18px;border-top:2px solid var(--mint)}
.swatch.ram {border-top:2px dashed var(--gold)}
.graph {height:158px;margin:12px 0 3px}
canvas {display:block;width:100%;height:100%}
.plot-meta {justify-content:space-between;gap:8px;border-top:1px solid #3a4d47;padding-top:10px;font:500 11px/1.4 var(--mono);color:#cedcd2}
.plot-meta strong {color:var(--gold);font-weight:600}
.events {min-width:0;padding:18px;display:flex;flex-direction:column}
.event-list {list-style:none;padding:0;margin:13px 0 9px;display:grid;gap:11px}
.event {position:relative;padding-left:18px;min-width:0}
.event:before {content:"";position:absolute;top:5px;left:0;width:9px;height:9px;border:2px solid #a66b2e;border-radius:50%;background:var(--card)}
.event.good:before {border-color:#337960}.event.unknown:before {border-color:#66726b}
.event strong {font-size:13px;line-height:1.4;display:block}
.event small {display:block;color:var(--muted);font-size:12px;margin-top:1px}
.event time {font:500 10px/1.4 var(--mono);color:#496458;margin-right:7px}
.rule {font-size:11px;color:var(--muted);margin-top:auto;border-top:1px solid var(--line);padding-top:9px}
.hardware {margin-top:12px;padding:0 17px}
summary {font-size:13px;font-weight:650;padding:11px 0;color:#294b40}
.specs {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px;margin:0;padding:3px 0 14px}
.specs dt {font-size:11px;color:var(--muted)}
.specs dd {font-size:12px;font-weight:600;margin:1px 0 0;overflow-wrap:anywhere}
@media (max-width:720px) {
  .shell {padding:16px 14px}.body-grid {grid-template-columns:1fr}
  .events {padding:15px 18px}.event-list {margin-top:10px}.tile {padding:12px}
  .metrics {gap:8px}.info {font-size:11px}.tile h2 {font-size:12px}
}
@media (max-width:540px) {
  .shell {padding:15px 10px}.brand {gap:9px}.mark {height:37px;width:37px;border-radius:9px}
  h1 {font-size:25px}.subtitle {font-size:11px}.export {font-size:12px;padding:7px 9px}
  .strip {gap:6px;padding:12px 0}.replay-control {gap:5px}.replay-control label {font-size:11px}
  input[type=range] {width:76px}.mode {font-size:12px;gap:6px}
  .metrics {grid-template-columns:1fr;gap:6px}
  .tile {display:grid;grid-template-columns:minmax(110px,1fr) auto;gap:3px 10px;align-items:center;padding:9px 12px}
  .tile-top {justify-content:flex-start;gap:8px}.value-row {grid-column:2;grid-row:1/3;justify-self:end;margin:0}
  .value {font-size:29px}.unit {font-size:12px}.tile .track {display:none}
  .info {margin:0}.chart {padding:15px 12px 10px}.graph {height:145px}
  .specs {grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><span aria-hidden="true" class="mark"><i></i><i></i><i></i><i></i><i></i></span>
      <div><h1>SystemScope</h1><p class="subtitle">Hardware &amp; performance monitor</p></div>
    </div>
    <button id="export" class="export" type="button"><span class="arrow" aria-hidden="true">↓</span> Export report</button>
  </header>
  <div class="strip">
    <p class="mode"><span class="mode-dot" aria-hidden="true"></span><span id="source">Sample replay</span></p>
    <div id="scrubber" class="replay-control">
      <label for="replay">Replay time</label>
      <input id="replay" type="range" min="0" max="5" step="1" value="2">
      <output for="replay" id="chosen" class="time-label">4 s</output>
    </div>
    <p id="live-caption" class="live-caption" hidden></p>
  </div>
  <div class="metrics" aria-label="Current readings">
    <section class="tile"><div class="tile-top"><h2>CPU load</h2></div>
      <div class="value-row"><strong class="value" id="cpu">—</strong><span class="unit">%</span></div>
      <div class="track" aria-hidden="true"><span id="cpu-fill" class="fill"></span></div><p class="info" id="cpu-note"></p>
    </section>
    <section class="tile"><div class="tile-top"><h2>Available RAM</h2><span class="badge" id="ram-badge"></span></div>
      <div class="value-row"><strong class="value" id="ram">—</strong><span class="unit">GiB</span></div>
      <div class="track" aria-hidden="true"><span id="ram-fill" class="fill"></span></div><p class="info" id="ram-note"></p>
    </section>
    <section class="tile"><div class="tile-top"><h2>Windows drive free</h2><span class="badge" id="disk-badge"></span></div>
      <div class="value-row"><strong class="value" id="disk">—</strong><span class="unit">GiB</span></div>
      <div class="track" aria-hidden="true"><span id="disk-fill" class="fill"></span></div><p class="info" id="disk-note"></p>
    </section>
  </div>
  <div class="body-grid">
    <section class="chart"><div class="panel-head"><h2>Usage history</h2>
      <div class="key"><span><i class="swatch"></i>CPU</span><span><i class="swatch ram"></i>RAM</span></div></div>
      <div class="graph"><canvas id="plot" role="img" aria-label="CPU and RAM use over time"></canvas></div>
      <div class="plot-meta"><span>Peak RAM use <strong id="peak">—</strong></span><span id="count"></span></div>
    </section>
    <section class="events"><h2>Status history</h2><ol id="events" class="event-list"></ol><p id="rule" class="rule"></p></section>
  </div>
  <details class="hardware"><summary>Computer details</summary><dl id="specs" class="specs"></dl></details>
</main>
<script type="application/json" id="sample-data">[{"elapsed_s":0,"cpu_pct":18,"ram_available_gib":4.8,"ram_total_gib":12,"disk_free_gib":14,"disk_total_gib":117,"ram_status":"OK","disk_status":"Low"},{"elapsed_s":2,"cpu_pct":35,"ram_available_gib":2.4,"ram_total_gib":12,"disk_free_gib":14,"disk_total_gib":117,"ram_status":"OK","disk_status":"Low"},{"elapsed_s":4,"cpu_pct":62,"ram_available_gib":1.2,"ram_total_gib":12,"disk_free_gib":14,"disk_total_gib":117,"ram_status":"Low","disk_status":"Low"},{"elapsed_s":6,"cpu_pct":43,"ram_available_gib":0.9,"ram_total_gib":12,"disk_free_gib":14,"disk_total_gib":117,"ram_status":"Low","disk_status":"Low"},{"elapsed_s":8,"cpu_pct":23,"ram_available_gib":2.4,"ram_total_gib":12,"disk_free_gib":14,"disk_total_gib":117,"ram_status":"OK","disk_status":"Low"},{"elapsed_s":10,"cpu_pct":16,"ram_available_gib":4.8,"ram_total_gib":12,"disk_free_gib":14,"disk_total_gib":117,"ram_status":"OK","disk_status":"Low"}]</script>
<script>
"use strict";
const byId = id => document.getElementById(id);
const sample = JSON.parse(byId("sample-data").textContent);
let model = {mode:"Sample replay", rows:sample, paused:false, threshold:15, specs:{
  CPU:"Example processor", "Logical processors":4, "Operating system and build":"Windows (simulated device)"
}};
let selected = 2;
let visible = [], reportText = "", sizeSent = 0, hostOrigin = "*";
const embedded = window.parent !== window;
const remaining = (value,total) => Number.isFinite(value) && total > 0 ? 100 * value / total : null;
const usedRam = r => {
  const pct = remaining(r.ram_available_gib,r.ram_total_gib);
  return pct === null ? null : 100 - pct;
};
const amount = x => Number.isFinite(x) ? x.toFixed(1) : "—";
const pctText = x => Number.isFinite(x) ? x.toFixed(1)+"%" : "Unavailable";
const seconds = x => Number(x.toFixed(1))+" s";
const capText = (v,t) => remaining(v,t) === null ? "Reading unavailable" : amount(v)+" of "+amount(t)+" GiB ("+pctText(remaining(v,t))+")";
function text(id,value) { byId(id).textContent=value; }
function meter(key,value,status) {
  const fill=byId(key+"-fill");
  fill.style.width=Math.min(100,Math.max(0,value ?? 0))+"%";
  fill.classList.toggle("low",status==="Low");
}
function card(key,value,total,status) {
  const pct=remaining(value,total);
  text(key,amount(value));
  const badge=byId(key+"-badge");
  badge.textContent=status;
  badge.className="badge "+({Low:"low",OK:"ok",Unavailable:"unknown"}[status] || "unknown");
  meter(key,pct,status);
  const unit=key==="ram" ? " available" : " free";
  text(key+"-note",pct===null ? "Reading unavailable" : pctText(pct)+unit+" · "+amount(total)+" GiB total");
}
function changes(rows) {
  const events=[];
  rows.forEach((r,i) => {
    for(const [key,name,available,total] of [
      ["ram_status","Memory",r.ram_available_gib,r.ram_total_gib],
      ["disk_status","Storage",r.disk_free_gib,r.disk_total_gib]
    ]) {
      const now=r[key], before=i ? rows[i-1][key] : null;
      if(now===before || (!i && now==="OK")) continue;
      let title;
      if(now==="Unavailable") title=name+" reading unavailable";
      else if(!i) title=name+" low at window start";
      else if(before==="Unavailable") title=name+" reading returned · "+now;
      else title=now==="Low" ? name+" went low" : name+" recovered";
      events.push({title, detail:capText(available,total), status:now, t:r.elapsed_s});
    }
  });
  return events.reverse().slice(0,3);
}
function eventList(rows) {
  const list=byId("events");
  list.replaceChildren();
  const items=changes(rows);
  if(!items.length) {
    const li=document.createElement("li");
    li.className="event good"; li.textContent="No warnings in this window."; list.append(li);
  }
  for(const e of items) {
    const li=document.createElement("li"), name=document.createElement("strong");
    const detail=document.createElement("small"), time=document.createElement("time");
    li.className="event "+({OK:"good",Unavailable:"unknown"}[e.status] || "low");
    time.textContent=seconds(e.t);
    name.append(time,document.createTextNode(e.title));
    detail.textContent=e.detail;
    li.append(name,detail); list.append(li);
  }
}
function details(values) {
  const list=byId("specs");
  list.replaceChildren();
  for(const [key,value] of Object.entries(values)) {
    const cell=document.createElement("div"), label=document.createElement("dt"), val=document.createElement("dd");
    label.textContent=key; val.textContent=value; cell.append(label,val); list.append(cell);
  }
}
function drawChart() {
  if(!visible.length) return;
  const canvas=byId("plot"), box=canvas.getBoundingClientRect();
  if(!box.width || !box.height) return;
  const w=box.width,h=box.height,ratio=Math.min(window.devicePixelRatio || 1,2);
  const width=Math.round(w*ratio), height=Math.round(h*ratio);
  if(canvas.width!==width || canvas.height!==height) {canvas.width=width; canvas.height=height;}
  const g=canvas.getContext("2d");
  g.setTransform(ratio,0,0,ratio,0,0); g.clearRect(0,0,w,h);
  const left=34,right=w-14,top=9,bottom=h-22;
  const last=visible[visible.length-1], start=visible[0].elapsed_s;
  const end=Math.max(start+2,model.mode==="Sample replay" ? model.rows[model.rows.length-1].elapsed_s : last.elapsed_s);
  const x=t=>left+(right-left)*(t-start)/(end-start);
  const y=p=>bottom-(bottom-top)*Math.max(0,Math.min(100,p))/100;
  g.font='10px Consolas,"Liberation Mono",monospace'; g.textBaseline="middle"; g.lineWidth=1;
  for(const value of [0,25,50,75,100]) {
    g.fillStyle="#bbc9c0"; g.textAlign="right"; g.fillText(value+"%",left-6,y(value));
    g.strokeStyle="#3c514a"; g.beginPath(); g.moveTo(left,y(value)); g.lineTo(right,y(value)); g.stroke();
  }
  const divisions=w<400 ? 2 : 5;
  for(let i=0;i<=divisions;i++) {
    const t=start+(end-start)*i/divisions;
    g.fillStyle="#bbc9c0"; g.textAlign=i===0?"left":i===divisions?"right":"center";
    g.fillText(seconds(t),x(t),h-8);
  }
  g.save(); g.strokeStyle="#82998d"; g.setLineDash([2,4]); g.beginPath();
  g.moveTo(x(last.elapsed_s),top); g.lineTo(x(last.elapsed_s),bottom); g.stroke(); g.restore();
  function series(value,color,dash) {
    g.save(); g.strokeStyle=color; g.fillStyle=color; g.lineWidth=2.5; g.setLineDash(dash);
    g.lineJoin="round"; g.lineCap="round"; g.beginPath();
    let previousTime=null;
    for(const r of visible) {
      const v=value(r);
      if(!Number.isFinite(v)) { previousTime=null; continue; }
      // A pause or suspended tab leaves a real gap in the live record.
      const hasGap=model.mode==="Live laptop" && r.elapsed_s-previousTime>5;
      if(previousTime===null || hasGap) g.moveTo(x(r.elapsed_s),y(v));
      else g.lineTo(x(r.elapsed_s),y(v));
      previousTime=r.elapsed_s;
    }
    g.stroke();
    const endValue=value(last);
    if(Number.isFinite(endValue)) {g.beginPath(); g.arc(x(last.elapsed_s),y(endValue),3.4,0,2*Math.PI); g.fill();}
    g.restore();
  }
  series(r=>r.cpu_pct,"#75e3bb",[]);
  series(usedRam,"#ffc483",[6,5]);
}
function render() {
  if(!model.rows.length) return;
  const replay=model.mode==="Sample replay";
  selected=Math.min(Math.max(0,selected),model.rows.length-1);
  visible=replay ? model.rows.slice(0,selected+1) : model.rows;
  const r=visible[visible.length-1];
  const time=seconds(r.elapsed_s);
  const slider=byId("replay"); slider.max=model.rows.length-1; slider.value=selected;
  slider.setAttribute("aria-valuetext",time);
  text("chosen",time); text("source",model.mode);
  byId("scrubber").hidden=!replay; byId("live-caption").hidden=replay;
  text("live-caption",(model.paused ? "Paused" : "Reading every 2 s")+" · "+time);
  text("cpu",Number.isFinite(r.cpu_pct)?Math.round(r.cpu_pct):"—"); meter("cpu",r.cpu_pct,"OK");
  const previous=visible.length>1?visible[visible.length-2]:null;
  let cpuNote="First reading";
  if(previous && Number.isFinite(previous.cpu_pct) && Number.isFinite(r.cpu_pct)) {
    const change=r.cpu_pct-previous.cpu_pct;
    cpuNote=change===0 ? "Same as previous reading" :
      (change>0?"Up ":"Down ")+Number(Math.abs(change).toFixed(1))+" points since last reading";
  }
  text("cpu-note",cpuNote);
  card("ram",r.ram_available_gib,r.ram_total_gib,r.ram_status);
  card("disk",r.disk_free_gib,r.disk_total_gib,r.disk_status);
  const levels=visible.map(usedRam).filter(Number.isFinite);
  const peak=levels.length?Math.max(...levels):null;
  text("peak",pctText(peak)); text("count",visible.length+" reading"+(visible.length===1?"":"s"));
  text("rule","Warning level · below "+model.threshold+"% available RAM or free storage.");
  eventList(visible);
  byId("plot").setAttribute("aria-label","At "+time+", CPU use "+pctText(r.cpu_pct)+", RAM use "+pctText(usedRam(r))+". Peak RAM use "+pctText(peak)+".");
  const equipment={...model.specs,"Usable RAM":amount(r.ram_total_gib)+" GiB","Windows drive capacity":Number.isFinite(r.disk_total_gib)?amount(r.disk_total_gib)+" GiB":"Unavailable"};
  details(equipment);
  const report={
    "Data source":model.mode, "Elapsed time":time, ...model.specs, "CPU used":pctText(r.cpu_pct),
    "RAM available / usable total":r.ram_status+" · "+capText(r.ram_available_gib,r.ram_total_gib),
    "Windows drive free / capacity":r.disk_status+" · "+capText(r.disk_free_gib,r.disk_total_gib),
    "Peak RAM used in this chart":pctText(peak), "Warning rule":"Below "+model.threshold+"% available RAM or free drive space"
  };
  reportText="# SystemScope specification report\n\n"+Object.entries(report).map(([k,v])=>"- **"+k+"** — "+v).join("\n")+"\n";
  drawChart();
}
byId("replay").addEventListener("input", e=>{selected=Number(e.target.value); render();});
byId("export").addEventListener("click",()=>{
  const url=URL.createObjectURL(new Blob([reportText],{type:"text/markdown;charset=utf-8"}));
  const link=document.createElement("a");
  link.href=url; link.download=model.mode==="Sample replay"?"demo-report.md":"live-report.md";
  document.body.append(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
});
function send(type,extra={}) {
  if(embedded) window.parent.postMessage({isStreamlitMessage:true,type,...extra},hostOrigin);
}
function sendHeight() {
  const h=Math.ceil(document.querySelector("main").getBoundingClientRect().height)+2;
  if(h!==sizeSent) {sizeSent=h;send("streamlit:setFrameHeight",{height:h});}
}
window.addEventListener("message",e=>{
  if(!embedded || e.source!==window.parent || e.data?.type!=="streamlit:render") return;
  const a=e.data.args;
  if(!a || !Array.isArray(a.rows) || !a.rows.length || !a.specs) return;
  hostOrigin=e.origin && e.origin!=="null" ? e.origin : "*";
  if(model.mode!==a.mode) selected=2;
  model={rows:a.rows,mode:a.mode,paused:a.paused,threshold:a.threshold,specs:a.specs};
  render(); sendHeight();
});
new ResizeObserver(()=>{drawChart();sendHeight();}).observe(document.querySelector("main"));
render();
send("streamlit:componentReady",{apiVersion:1});
</script>
</body>
</html>
